<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Boneyard Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@400;500&family=Pirata+One&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column (max 880px). Title block, then the game stage with touch pad and key hints,
   then a two-column manual (controls | obstacle field guide) that stacks on phones.
   Single dark look by choice: the page is a night scene. */
:root {
  --ink: #0d0a14;
  --panel: #171122;
  --line: #31274a;
  --bone: #ece4cf;
  --dim: #a99fbd;
  --pumpkin: #ff7a1a;
  --pumpkin-ink: #1c0e00;
  --pumpkin-wash: #2e1b0e;
  --spirit: #bff7e4;
  --font-display: "Pirata One", "Rockwell", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
body {
  background-color: var(--ink);
  background-image: radial-gradient(900px 420px at 80% -80px, #2b1743 0%, rgba(13, 10, 20, 0) 70%);
  color: var(--bone);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 32px; min-width: 0; }
header h1 {
  font: 400 clamp(46px, 10vw, 78px) / 0.95 var(--font-display);
  letter-spacing: 0.01em; margin: 0 0 12px; text-wrap: balance;
}
header p { margin: 0; color: var(--dim); max-width: 60ch; }
header p.quick { margin-top: 12px; color: var(--bone); }
kbd {
  font-family: var(--font-mono); font-size: 0.85em; color: var(--bone);
  background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 6px; padding: 1px 7px; white-space: nowrap;
}

/* Stage */
.stage {
  position: relative; background: #0a0614; border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden;
}
.stage canvas { display: block; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.overlay {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
  gap: 10px; padding: 16px; text-align: center; cursor: pointer;
  background: rgba(8, 5, 14, 0.62);
}
.overlay h2 {
  font: 400 clamp(30px, 6vw, 46px) / 1.05 var(--font-display);
  margin: 0; text-wrap: balance;
}
.overlay p { margin: 0; color: var(--dim); font-size: 15px; max-width: 40ch; }
.overlay .score { font-family: var(--font-mono); color: var(--bone); font-size: 16px; }
.overlay .best { color: var(--pumpkin); font-weight: 700; }
.primary {
  font: 700 16px var(--font-body); background: var(--pumpkin); color: var(--pumpkin-ink);
  border: 0; border-radius: 10px; padding: 12px 24px; cursor: pointer; margin-top: 6px;
}
.primary:focus-visible, .padbtn:focus-visible, .toolbtn:focus-visible { outline: 3px solid var(--bone); outline-offset: 3px; }

/* Touch pad and tools */
.pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.padbtn {
  height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--bone); font: 700 17px var(--font-body); cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.padbtn[data-on="true"] { border-color: var(--pumpkin); background: var(--pumpkin-wash); }
.tools {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  justify-content: space-between; margin-top: 12px; color: var(--dim); font-size: 14px;
}
.tools .hints { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; min-width: 0; }
.tools .btns { display: flex; gap: 8px; }
.toolbtn {
  background: transparent; border: 1px solid var(--line); color: var(--bone);
  border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer;
}

/* Manual */
.manual { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 36px; }
.manual h2 { font: 400 32px / 1.1 var(--font-display); margin: 0 0 10px; }
.manual p { margin: 0 0 14px; color: var(--dim); max-width: 60ch; }
.keys { margin: 0 0 18px; display: grid; gap: 0; }
.keys .row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.keys .row:last-child { border-bottom: 1px solid var(--line); }
.keys dt { font-weight: 700; }
.keys dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--dim); font-size: 15px; }
.tips { margin: 0; padding-left: 18px; color: var(--dim); display: grid; gap: 6px; font-size: 15px; }
.guide { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.guide li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.guide li:last-child { border-bottom: 1px solid var(--line); }
.icon { width: 140px; height: 124px; border-radius: 8px; display: block; max-width: 100%; }
.guide h3 { margin: 0 0 4px; font-size: 17px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.guide p { margin: 0; font-size: 15px; color: var(--dim); }
.chip { font: 500 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid; border-radius: 999px; padding: 2px 10px; }
.chip.jump { color: var(--pumpkin); border-color: var(--pumpkin); }
.chip.duck { color: var(--spirit); border-color: var(--spirit); }
.chip.run { color: var(--dim); border-color: var(--dim); }
footer { color: var(--dim); font-size: 14px; }

@media (max-width: 720px) {
  .manual { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .guide li { grid-template-columns: 112px minmax(0, 1fr); gap: 12px; }
  .icon { width: 112px; height: 99px; }
}
</style>

<script>
(function () {
'use strict';
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;
var h = React.createElement;

/* ---------- constants ---------- */
var H = 300;            // logical canvas height
var GY = 250;           // ground line
var GRAV = 0.62, JUMPV = 12.5;
var V0 = 5.6, VMAX = 12.5, ACCEL = 0.0016;
var PERIOD = 1800, TEX = 1200, MIST_P = 1700;

var C = {
  sky0: '#0a0614', sky1: '#1c0f31', sky2: '#3b1c4c',
  ground: '#150f20', groundLine: '#8a7ba6', tex: '#33284a',
  sil: '#120b1d', window: 'rgba(255,176,74,0.9)',
  moon: '#f3ead0', moonShade: 'rgba(160,148,120,0.35)',
  bone: '#ece4cf', boneDark: '#b3a98e', ink: '#0d0a14', dim: '#a99fbd',
  pumpkin: '#ff7a1a',
  wood: '#7a5530', shirt: '#8a3530', patch: '#c98a2b', straw: '#e0ac45', sack: '#cfae74', hat: '#2a1d45',
  batBody: '#5a37a0', batWing: '#8c67d6', batEye: '#ff5a5a',
  ghost: 'rgba(191,247,228,0.92)', spirit: '#bff7e4'
};

/* ---------- storage ---------- */
function loadHi() { try { return parseInt(localStorage.getItem('boneyard-dash-hi') || '0', 10) || 0; } catch (e) { return 0; } }
function saveHi(v) { try { localStorage.setItem('boneyard-dash-hi', String(v)); } catch (e) {} }
function pad(v) { return String(Math.floor(v)).padStart(5, '0'); }

/* ---------- audio (starts only after a click, tap or key press) ---------- */
var audio = { ctx: null, muted: false };
function ensureAudio() {
  if (!audio.ctx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { audio.ctx = new AC(); } catch (e) {} }
  }

}
function tone(freq, dur, type, vol, endFreq, delay) {
  if (audio.muted || !audio.ctx) return;
  try {
    var t = audio.ctx.currentTime + (delay || 0);
    var o = audio.ctx.createOscillator(), gn = audio.ctx.createGain();

    o.frequency.setValueAtTime(freq, t);

    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);

var sfx = {
  jump: function () { tone(330, 0.14, 'square', 0.04, 620); },
  die: function () { tone(300, 0.45, 'sawtooth', 0.06, 50); tone(180, 0.5, 'square', 0.04, 40, 0.05); },
  milestone: function () { tone(660, 0.1, 'square', 0.04); tone(880, 0.14, 'square', 0.04, undefined, 0.11); }
};

/* ---------- deterministic scenery ---------- */
function rng(seed) { var s = seed >>> 0; return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
var scenery = (function () {
  var r = rng(11), a = [], x = 30;
  while (x < PERIOD - 120) {
    var t = r();
    a.push({ type: t < 0.4 ? 'tomb' : t < 0.62 ? 'tree' : t < 0.76 ? 'house' : 'cross', x: x, v: r() });
    x += 100 + r() * 140;
  }
  return a;
})();
var stars = (function () { var r = rng(5), a = []; for (var i = 0; i < 46; i++) a.push({ x: r(), y: r() * 150, s: r() < 0.2 ? 2 : 1, p: r() * 6.28 }); return a; })();
var bits = (function () { var r = rng(23), a = []; for (var i = 0; i < 80; i++) a.push({ x: r() * TEX, y: GY + 6 + r() * 40, w: 2 + Math.floor(r() * 6) }); return a; })();
var mist = [{ x: 0, y: GY - 18, w: 260, hh: 16 }, { x: 420, y: GY - 30, w: 340, hh: 20 }, { x: 900, y: GY - 14, w: 220, hh: 14 }, { x: 1300, y: GY - 26, w: 300, hh: 18 }];

/* ---------- sprites ---------- */
function drawScenery(ctx, it, x) {
  var b = GY;
  ctx.fillStyle = C.sil; ctx.strokeStyle = C.sil;
  if (it.type === 'tomb') {
    var w = 24 + it.v * 12, hh = 30 + it.v * 24;
    ctx.beginPath(); ctx.moveTo(x, b); ctx.lineTo(x, b - hh + w / 2);
    ctx.arc(x + w / 2, b - hh + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, b); ctx.closePath(); ctx.fill();
  } else if (it.type === 'cross') {
    var ch = 44 + it.v * 20;
    ctx.fillRect(x, b - ch, 5, ch); ctx.fillRect(x - 8, b - ch + 10, 21, 5);
  } else if (it.type === 'tree') {
    var ty = b - 60 - it.v * 30;
    ctx.lineCap = 'round'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x, b); ctx.lineTo(x + 3, ty); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(x + 3, ty); ctx.lineTo(x + 22, ty - 18); ctx.lineTo(x + 34, ty - 16);
    ctx.moveTo(x + 22, ty - 18); ctx.lineTo(x + 26, ty - 34);
    ctx.moveTo(x + 3, ty + 14); ctx.lineTo(x - 20, ty - 2); ctx.lineTo(x - 30, ty - 14);
    ctx.moveTo(x - 20, ty - 2); ctx.lineTo(x - 34, ty + 4);
    ctx.moveTo(x + 2, ty + 30); ctx.lineTo(x + 18, ty + 20);
    ctx.stroke();
  } else {
    ctx.fillRect(x, b - 58, 72, 58);
    ctx.beginPath(); ctx.moveTo(x - 6, b - 58); ctx.lineTo(x + 36, b - 92); ctx.lineTo(x + 78, b - 58); ctx.closePath(); ctx.fill();
    ctx.fillRect(x + 54, b - 96, 14, 40);
    ctx.beginPath(); ctx.moveTo(x + 51, b - 96); ctx.lineTo(x + 61, b - 112); ctx.lineTo(x + 71, b - 96); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.window;
    ctx.fillRect(x + 14, b - 40, 9, 13); ctx.fillRect(x + 46, b - 40, 9, 13); ctx.fillRect(x + 30, b - 76, 8, 10);
  }
}

// yb = y of the feet. Standing hitbox is about 44 wide, 44 tall; ducking is 56 wide, 22 tall.
function drawSkeleton(ctx, x, yb, o) {
  var duck = !!o.duck, dead = !!o.dead, air = !!o.air, f = o.frame | 0;
  var B = C.bone, D = C.boneDark, K = C.ink, P = C.pumpkin;
  function rect(a, b, w, hh, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x + a), Math.round(yb + b), w, hh); }
  function leg(hx, lift, topY, sh, fw) {
    var sH = sh - lift;
    rect(hx, topY, 4, sH, B);
    rect(hx, topY + sH, fw, 4, B);
  }
  if (!duck) {
    var l1 = air ? 5 : (f ? 0 : 8), l2 = air ? 5 : (f ? 8 : 0);
    leg(9, l1, -18, 14, 8); leg(17, l2, -18, 14, 8);
    rect(2, -34, 5, 3, B); rect(-3, -31, 5, 3, B); rect(-8, -28, 5, 3, D); rect(-12, -25, 4, 3, D);
    rect(6, -36, 22, 4, B);
    rect(10, -32, 3, 12, B); rect(15, -32, 3, 15, B); rect(20, -32, 3, 15, B); rect(25, -32, 3, 11, B);
    rect(6, -26, 8, 8, D);
    rect(28, -26, 6, 2, B); rect(33, -25, 2, 3, B);
    rect(24, -40, 5, 6, B);
    rect(26, -48, 11, 12, B); rect(35, -46, 10, 8, B); rect(33, -38, 11, 5, B);
    rect(35, -39, 9, 1, K);
    rect(30, -44, 5, 5, K); rect(42, -45, 2, 2, K);
    if (dead) {
      ctx.strokeStyle = P; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(x + 30.5, yb - 43.5); ctx.lineTo(x + 34.5, yb - 39.5);
      ctx.moveTo(x + 34.5, yb - 43.5); ctx.lineTo(x + 30.5, yb - 39.5); ctx.stroke();
    } else { rect(32, -43, 2, 2, P); }
  } else {
    var d1 = f ? 0 : 3, d2 = f ? 3 : 0;
    leg(8, d1, -10, 6, 7); leg(16, d2, -10, 6, 7);
    rect(-2, -21, 4, 3, D); rect(-7, -19, 4, 3, D); rect(-12, -17, 4, 3, D); rect(-16, -15, 4, 3, D);
    rect(2, -22, 34, 4, B);
    rect(10, -18, 3, 9, B); rect(15, -18, 3, 10, B); rect(20, -18, 3, 10, B); rect(25, -18, 3, 8, B);
    rect(4, -18, 8, 7, D);
    rect(36, -28, 11, 12, B); rect(45, -26, 10, 8, B); rect(43, -18, 11, 4, B);
    rect(45, -19, 9, 1, K);
    rect(40, -24, 5, 5, K); rect(52, -25, 2, 2, K);
    rect(42, -23, 2, 2, P);
  }
}

// T = total height: 50 (short) or 72 (tall pole). Width 36 (hands add a little more).
function drawScarecrow(ctx, x, gy, T) {
  var top = gy - T, cx = x + 18;
  ctx.fillStyle = C.wood;
  ctx.fillRect(cx - 2, top + 26, 4, T - 26);
  ctx.fillRect(x + 1, top + 28, 34, 4);
  ctx.fillStyle = C.shirt; ctx.fillRect(cx - 8, top + 27, 16, 17);
  ctx.fillStyle = C.patch; ctx.fillRect(cx - 5, top + 33, 5, 5);
  ctx.fillStyle = C.straw;
  ctx.fillRect(x - 4, top + 26, 5, 3); ctx.fillRect(x - 6, top + 29, 6, 2); ctx.fillRect(x - 4, top + 32, 5, 3);
  ctx.fillRect(x + 35, top + 26, 5, 3); ctx.fillRect(x + 36, top + 29, 6, 2); ctx.fillRect(x + 35, top + 32, 5, 3);
  ctx.fillRect(cx - 6, top + 44, 3, 5); ctx.fillRect(cx - 1, top + 44, 3, 6); ctx.fillRect(cx + 4, top + 44, 3, 4);
  ctx.fillStyle = C.sack; ctx.beginPath(); ctx.arc(cx, top + 19, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.pumpkin; ctx.fillRect(cx - 5, top + 16, 3, 3); ctx.fillRect(cx + 2, top + 16, 3, 3);
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(cx - 4, top + 23); ctx.lineTo(cx + 4, top + 23);
  for (var i = -3; i <= 3; i += 2) { ctx.moveTo(cx + i, top + 21); ctx.lineTo(cx + i, top + 25); }
  ctx.stroke();
  ctx.fillStyle = C.hat; ctx.fillRect(cx - 12, top + 11, 24, 3); ctx.fillRect(cx - 7, top, 14, 12);
  ctx.fillStyle = C.pumpkin; ctx.fillRect(cx - 7, top + 7, 14, 3);
}

// 40 x 24 box, (x, y) is the top-left corner
function drawBat(ctx, x, y, f) {
  var cx = x + 20, s, k;
  ctx.fillStyle = C.batWing;
  for (k = 0; k < 2; k++) {
    s = k ? 1 : -1;
    ctx.beginPath(); ctx.moveTo(cx + s * 4, y + 10);
    if (f === 0) {
      ctx.lineTo(cx + s * 18, y + 1); ctx.lineTo(cx + s * 20, y + 9); ctx.lineTo(cx + s * 14, y + 8);
      ctx.lineTo(cx + s * 13, y + 14); ctx.lineTo(cx + s * 8, y + 12); ctx.lineTo(cx + s * 4, y + 16);
    } else {
      ctx.lineTo(cx + s * 17, y + 14); ctx.lineTo(cx + s * 20, y + 23); ctx.lineTo(cx + s * 14, y + 19);
      ctx.lineTo(cx + s * 11, y + 23); ctx.lineTo(cx + s * 7, y + 18); ctx.lineTo(cx + s * 4, y + 17);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = C.batBody; ctx.fillRect(cx - 4, y + 6, 8, 12);
  ctx.beginPath(); ctx.moveTo(cx - 4, y + 6); ctx.lineTo(cx - 3, y + 1); ctx.lineTo(cx - 1, y + 6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 4, y + 6); ctx.lineTo(cx + 3, y + 1); ctx.lineTo(cx + 1, y + 6); ctx.closePath(); ctx.fill();

}

// 34 x 40 box, (x, y) is the top-left corner
function drawGhost(ctx, x, y, t) {
  var wv = Math.sin(t * 0.2) * 2;
  ctx.save();
  ctx.shadowColor = C.spirit; ctx.shadowBlur = 12;
  ctx.fillStyle = C.ghost;
  ctx.beginPath(); ctx.moveTo(x + 2, y + 40); ctx.lineTo(x + 2, y + 17);
  ctx.arc(x + 17, y + 17, 15, Math.PI, 0); ctx.lineTo(x + 32, y + 40);
  ctx.lineTo(x + 26, y + 34 + wv); ctx.lineTo(x + 20, y + 40); ctx.lineTo(x + 14, y + 34 - wv); ctx.lineTo(x + 8, y + 40);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = C.ink;
  ctx.fillRect(x + 10, y + 13, 4, 6); ctx.fillRect(x + 21, y + 13, 4, 6);
  ctx.fillRect(x + 15, y + 24, 5, 6);
}

/* ---------- game world ---------- */
function resetGame(g) {
  g.status = 'ready'; g.px = 56; g.py = 0; g.vy = 0; g.ducking = false;
  g.speed = V0; g.dist = 0; g.score = 0; g.newBest = false;
  g.obs = []; g.gapLeft = 260; g.tick = 0; g.scroll = 0; g.flash = 0; g.deadAt = 0;
  g.lastKind = ''; g.repeat = 0;
}

function spawn(g) {
  var s = g.score, r = Math.random(), kind = 'scare';
  if (s >= 250 && r > 0.8) kind = 'ghost';
  else if (s >= 120 && r > 0.55) kind = 'bat';
  if ((kind === 'bat' || kind === 'ghost') && g.lastKind === kind && g.repeat >= 1) kind = 'scare';
  g.repeat = kind === g.lastKind ? g.repeat + 1 : 0;
  g.lastKind = kind;
  var x = g.W + 30, o, i;
  if (kind === 'scare') {
    var tall = s > 150 && Math.random() < 0.35;
    var n = tall ? (s > 400 && Math.random() < 0.3 ? 2 : 1)
                 : (s > 500 ? 1 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * 2));
    var T = tall ? 72 : 50, boxes = [];
    for (i = 0; i < n; i++) { var ox = i * 46; boxes.push([ox + 10, 2, 16, 27], [ox + 13, 26, 10, T - 26], [ox + 2, 26, 32, 8]); }
    o = { kind: kind, x: x, y: GY - T, w: (n - 1) * 46 + 36, T: T, n: n, boxes: boxes, mul: 1 };
  } else if (kind === 'bat') {
    var q = Math.random(), y = q < 0.35 ? GY - 30 : q < 0.7 ? GY - 58 : GY - 100;
    o = { kind: kind, x: x, y: y, w: 40, boxes: [[6, 5, 28, 14]], mul: 1.12, ph: Math.random() * 5 };
  } else {
    o = { kind: kind, x: x, y: GY - 76, baseY: GY - 76, w: 34, boxes: [[5, 4, 24, 34]], mul: 0.88, ph: Math.random() * 6 };
  }
  g.obs.push(o);
  g.gapLeft = o.w + g.speed * (34 + Math.random() * 28);
}

function draw(ctx, g, now) {
  var W = g.W, i, it, px;
